<!DOCTYPE html>
<html>
<head><title>Article Page</title></head>
<body>
    <h1>{{.Title}}</h1>

    <div>
        <address>{{.CreatedAt}}</address>
    </div>

    <br>
    <form action="/articles/{{.ID}}" method="POST">
        <!-- Browsers only allow GET and POST in native HTML forms -->
        <input type="hidden" name="_method" value="DELETE">
        <button type="submit">Delete Article</button>
    </form>

    <hr>

    <div>
        {{printf "%s" .Body}}
    </div>

</body>
</html>
