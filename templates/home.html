<!DOCTYPE html>
<html>
<head><title>Home Page</title></head>
<body>
    <h1>Personal Blog</h1>
    <a href="/new">+ Add New Article</a>

    <details>
        <summary>Article list</summary>
            <ul>
                {{range .}}
                    <li>{{ .ID }} | <strong>{{ .Title }}</strong>    {{.CreatedAt}}</li>
                {{else}}
                    <li>No items available</li>
                {{end}}
            </ul>
    </details>

</body>
</html>
